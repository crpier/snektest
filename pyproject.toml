[project]
name = "snektest"
dynamic = ["version"]
description = "An async-native, type-safe Python testing framework"
readme = "README.md"
requires-python = ">=3.14"
license = "MIT"
license-files = ["LICENSE"]
authors = [
    { email = "crpier42@gmail.com" },
]
keywords = ["async", "testing", "type-checking"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "Operating System :: MacOS",
    "Operating System :: Microsoft :: Windows",
    "Operating System :: POSIX :: Linux",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.14",
    "Programming Language :: Python :: Implementation :: CPython",
    "Typing :: Typed",
]
dependencies = [
    "hypothesis>=6.0.0",
    "pydantic>=2.12.4",
    "rich>=14.2.0",
]

[project.optional-dependencies]
schema = [
    "schemathesis>=4.25.2,<4.26",
]

[dependency-groups]
dev = [
    "coverage>=7.13.1",
    "pip-audit>=2.10.1,<2.11",
    "ruff>=0.14.5",
    "schemathesis>=4.25.2,<4.26",
    "ty>=0.0.75",
]

[project.scripts]
snektest = "snektest.cli:main"

[project.urls]
Changelog = "https://github.com/crpier/snektest/blob/main/CHANGELOG.md"
Issues = "https://github.com/crpier/snektest/issues"
Repository = "https://github.com/crpier/snektest"
Security = "https://github.com/crpier/snektest/security/policy"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.uv]
required-version = "==0.9.26"

[tool.hatch.version]
path = "snektest/_version.py"

[tool.hatch.build.targets.wheel]
include = [
    "/snektest/**/*.py",
    "/snektest/**/*.pyi",
    "/snektest/py.typed",
]
only-include = ["snektest"]

[tool.hatch.build.targets.sdist]
include = [
    "/.gitignore",
    "/CHANGELOG.md",
    "/LICENSE",
    "/README.md",
    "/SECURITY.md",
    "/pyproject.toml",
    "/snektest/**/*.py",
    "/snektest/**/*.pyi",
    "/snektest/py.typed",
]

[tool.coverage.run]
parallel = true
relative_files = true
source = ["snektest"]
omit = ["*/snektest/examples/*"]

[tool.coverage.report]
fail_under = 90

### Formatting and static checking tools ###
[tool.ruff]
line-length = 88

[tool.ruff.lint]
preview = false
select = [ "A", "ANN", "ARG", "ASYNC", "B", "BLE", "C4", "C90", "COM", "DTZ", "E", "EM", "ERA", "EXE", "F", "FAST", "FBT", "FURB", "G", "I", "INP", "ISC", "LOG", "N", "PERF", "PGH", "PIE", "PL", "PLE", "PLR", "PLW", "PTH", "PYI", "Q", "RET", "RSE", "RUF", "S", "SIM", "SLF", "SLOT", "T10", "T20", "TC", "TID", "TRY", "UP", "W" ]
extend-select = [
  "DOC", # For docstrings. Requires "preview" to be enabled.
  # Select only some of the `TD` rules.
  "TD004",   # Check for colon after "TODO" keyword.
  "TD005",   # Check for description.
  "TD006",   # Check for proper capitalization.
  "TD007",   # Check for missing space after colon.
]
ignore = [
  "ANN401",  # Allow the use of `typing.Any`.
  "BLE001",  # Allow using blind except (e.g. `except Exception`).
  "COM812",  # Don't require trailing commas. Ignored because it may interfere with formatting.
  "DOC201",  # Don't make me document return values.
  "E501",    # Allow long lines. Useful mostly for writing log and error messages: having them in a single line makes it easier to search for the message. Note that the formatter will still try to shorten line length whenever possible.
  "PLC1901", # Allow comparing with empty strings. This is needed when the variable could be another falsy value, like `None`.
  "PLW3201", # Let me create dunder methods
  "PTH110",  # Allow using `os.path.exists`. Removed because Path.exists is 4 times slower.
  "S311",    # Allow pseudo-random generators.
  "T201",    # Allow `print` statements. Useful mostly for debugging.
  "TC001",   # Don't suggest putting imports in `TYPE_CHECKING` blocks. Mostly makes sense for Python>=3.11.
  "TC002",   # Don't suggest putting third party imports in `TYPE_CHECKING` blocks. Mostly makes sense for Python>=3.11.
  "TC003",   # Don't suggest putting stdlib imports in `TYPE_CHECKING` blocks. Mostly makes sense for Python>=3.11.
]

[tool.ruff.lint.per-file-ignores]
"tests/*" = [
  "FBT003",  # Allow boolean positional values in function calls. This is useful for assert_* function.
  "N802",    # Don't force function names to be snake_case. Useful e.g. when writing tests for classes.
  "N999",    # Don't force module names to be snake_case. Useful e.g. when writing tests for classes.
  "PLR2004", # Allow magic numbers.
  "RUF029",  # Allow async functions without async features.
  "S105",    # Allow hardcoded password strings.
  "S106",    # Allow hardcoded password strings.
  "S107",    # Allow hardcoded password strings.
  "S404",    # Allow subprocess in tests.
  "S603",    # Allow subprocess in tests.
  "S607",    # Allow subprocess in tests.
  "S608",    # Allow string building with SQL.
  "SLF001",  # Allow private member access.
  "T100",    # Allow breakpoints in tests (we have some tests that really check breakopints).
]
"testutils/*" = [
  "S404",    # Allow subprocess in tests.
  "S603",    # Allow subprocess in tests.
]
"*/annotations.py" = [
  "N816"     # Let me use mixed case for names like `validate_SomeType`.
]
"snektest/output.py" = [
  "DOC402",  # Don't require documenting yields in context managers.
  "FBT001",  # Allow boolean positional arguments for simple flags.
]

[tool.ty.rules]
all = "error"

[tool.ty.analysis]
strict-equality-semantics = true
strict-generic-narrowing = true
